
[profiles]

[profiles.default]
leading = ["apple-menu", "fullscreen", "app-menu", "omniwm", "layout", "workspaces", "scratchpads"]
trailing = ["network", "cpu", "gpu", "sensors", "media", "notifications", "mic", "volume", "wifi", "battery-details", "control-center", "system-stats", "clock"]
theme = "tinty"

[profiles.default.workspaceBar]
autoHide = false
backgroundOpacity = 1.0
deduplicateAppIcons = false
height = 48.0
position = "belowMenuBar"
reserveLayoutSpace = false
transparentBackground = false
yOffset = 20.0
