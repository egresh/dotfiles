
[profiles]

[profiles.default]
leading = ["apple-menu", "fullscreen", "app-menu", "omniwm", "workspaces", "scratchpads"]
trailing = ["network", "gpu", "cpu", "sensors", "media", "notifications", "volume", "wifi", "battery-details", "control-center", "system-stats", "clock"]
theme = "tinty"

[profiles.default.workspaceBar]
autoHide = false
backgroundOpacity = 1.0
deduplicateAppIcons = false
height = 58.0
position = "overlappingMenuBar"
transparentBackground = false
