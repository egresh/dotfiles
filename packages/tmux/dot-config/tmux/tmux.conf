# bind -r = repeatable
# bind -n = no prefix required
# pane_current_path -> open new window/pane in same directory
# set -g = global
# set -a = append to string

set -g history-limit         20000                  # Number of lines of scrollback per window
set -g prefix                C-a                    # Global prefix to <ctrl>-a
set -g base-index            1                      # Start windows off at 1 rather than 0
set -g pane-base-index       1                      # Start panes off at 1 rather than 0
set -g repeat-time           1000                   # Increase timeout for multiple C-key presses
set -g renumber-windows      on                     # Adjust gaps in window numbering
set -g mouse                 off                     # Allow mouse inputs
set -g mode-keys             vi                     # Use VI bindings for copy-mode
set -g escape-time           0                      # Wait time in ms to wait after an escape sequence
set -g default-shell         /opt/homebrew/bin/fish
set -g status-keys           "vi"                   # When in the status bar (:command) use vi mode
set -g status-interval       2                      # How often the status bar is updated
set -g monitor-activity      on                     # Identify activity in other windows
set -g visual-activity       off                    # Don't display a message in the status line
set -g status                on                     # Show status line
set -g focus-events          on
set -g terminal-overrides    ",*256col*:Tc"            # WezTerm support, kitty autodetects
set -g status-position       top
set -g detach-on-destroy     off

# Give C-b back, C-a is the prefix
unbind C-b
bind   C-a    send-prefix

# Layouts/Windows/Panes
bind -r H      resize-pane   -L 5
bind -r J      resize-pane   -D 5
bind -r K      resize-pane   -U 5
bind -r L      resize-pane   -R 5

bind    h      select-layout main-horizontal
bind    C-h    select-layout even-vertical
bind    v      select-layout main-vertical
bind    C-v    select-layout even-horizontal
bind    C-t    select-layout tiled
bind -r [      rotate-window -UZ
bind -r ]      rotate-window -DZ

bind    !      break-pane -d

bind    f      last-pane \; resize-pane -Z
bind    o      last-window
bind    c      new-window      -c "#{pane_current_path}"
bind    '\'    split-window -h -c "#{pane_current_path}"
bind    -      split-window -v -c "#{pane_current_path}"

# r, C-r
bind    r      command-prompt "rename-window '%%%'"
bind    C-r    source-file ~/.config/tmux/tmux.conf \; \
               display "TMUX Config Reloaded!"
# s, C-s
bind    s      set-option status
bind    C-s    if -F "#{>:#{server_sessions},1}" {
  run-shell -C "display-popup -E -w 40% \"tmux list-sessions \
  -f '##{!=:##{session_name},#{session_name}}' \
  -F '##{==:##{session_name},#{client_last_session}} ##{session_last_attached} ##{session_name}' \
  | sort -k1,1nr -k2,2nr \
  | cut -d' ' -f3- \
  | gum filter --limit 1 --placeholder 'Pick a sesh' --prompt '⚡  ' \
  | xargs -I{} tmux switch-client -t '{}:'\""
} {
  display-popup -w 21 -h 3 -E "printf '\\033[?25l No Other Sessions '; sleep 1"
}

# g, G
bind -N "open path:line refs (visible screen) in nvim" \
  g run-shell -b "$HOME/bin/nvim-refs --visible"
bind -N "open path:line refs (full history) in nvim" \
  G run-shell -b "$HOME/bin/nvim-refs"

# w, W, C-w
bind w run-shell "workmux sidebar --position left  --width 40 --height 3"
bind -N "workmux dashboard" \
  W   display-popup -E -w 60% -h 60% -d "#{pane_current_path}" "workmux dashboard"
bind \
  C-w run-shell -b "$HOME/bin/tmux-worktree"

bind \
  ,   display-popup -E -w 40% -h 50% "tmux select-window -t :$(
  tmux list-windows -F '#{window_name}' | gum filter --limit 1 --placeholder 'Pick a window' --prompt '⚡  ')"

bind-key "t" display-popup -E -w 80% -h 70% "sesh picker -i"

# SESH
set-hook -g pane-focus-in 'run-shell "sketchybar --trigger omniwm_focus_change"'

# Vim Tmux Navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n Left if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n Down if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n Up if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n Right if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# Copy-mode 
bind  k copy-mode
bind  p paste-buffer
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi "'" send-keys -X jump-to-mark
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel pbcopy

# Eye Candy
set -g pane-border-indicators both
set -g pane-border-lines double
set -g pane-border-status off

set -g popup-border-lines rounded

set -g status-justify centre

set -g status-left-length 50

set -g status-left "#{?client_prefix,\
#[fg=colour1#,bg=colour235]#[fg=colour11#,bg=colour1]#S#[fg=colour1#,bg=colour235],\
#[fg=colour202#,bg=colour235]#[fg=colour190#,bg=colour202]#S#[fg=colour202#,bg=colour235]}"

set -g status-right "#[none]"

set -g window-status-current-format "#{?window_zoomed_flag,\
#[fg=colour1#,bg=colour235]#[fg=colour11#,bg=colour1]󱉶 #I#W#[fg=colour1#,bg=colour235],\
#[fg=colour13#,bg=colour0]#[fg=colour4#,bg=colour13]#I#W#[fg=colour13#,bg=colour0]}"

set -g window-status-format "#{?window_zoomed_flag,\
#[fg=colour239#,bg=colour0]#[fg=colour15#,bg=colour239]󱉶 #I#W#[fg=colour239#,bg=colour235],\
#[fg=colour239#,bg=colour235]#[fg=colour15#,bg=colour239]#I#W#[fg=colour239#,bg=colour235]}"

# u with arg "all" will update plugins.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'IngoMeyer441/tmux-easy-motion'
set -g @plugin 'tinted-theming/tinted-tmux'
set -g @easy-motion-prefix "a"
set -g @easy-motion-verbose "true"

# Before tpm: tinted-tmux reads this when it loads.
run-shell "tmux set-option -g @tinted-color $(tinty current)"

run '~/.config/tmux/plugins/tpm/tpm'

# After tpm so tinted-tmux doesn't override them.
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue,bold"
set -g window-style "fg=colour245,bg=#1a1a1a"
set -g window-active-style "fg=#d0d0d0,bg=#000000" # explicit: "default" does not undo window-style; = isotope base05/base00

